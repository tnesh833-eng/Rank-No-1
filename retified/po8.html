<!-- ============================================================
     RESUME BUILDER + ATS CHECKER TAB (v3.1 - Antigravity Enhanced)
     ============================================================ -->

<section id="resumeTab" class="tab-content">
  <h2>📄 Resume Builder & ATS Checker</h2>

  <!-- ================= 1. FAST PROFILE IMPORT ================= -->
  <div class="card antigravity-element">
    <h3>1. Fast Import Profile Data</h3>
    <p class="hint">Connect your account to auto-fill your profile details into the selected template format.</p>
    
    <div class="social-login-group">
      <button type="button" class="btn-social btn-linkedin" onclick="connectLinkedIn()">
        <svg viewBox="0 0 24 24" class="icon"><path fill="currentColor" d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg>
        Import from LinkedIn
      </button>

      <button type="button" class="btn-social btn-google" onclick="connectGoogle()">
        <svg viewBox="0 0 24 24" class="icon"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Import from Google
      </button>

      <button type="button" class="btn-social btn-microsoft" onclick="connectMicrosoft()">
        <svg viewBox="0 0 23 23" class="icon"><path fill="#f35325" d="M1 1h10v10H1z"/><path fill="#81bc06" d="M12 1h10v10H12z"/><path fill="#05a6f0" d="M1 12h10v10H1z"/><path fill="#ffba08" d="M12 12h10v10H12z"/></svg>
        Import from Microsoft Edge / 365
      </button>
    </div>
    <div id="importStatus" class="status-msg"></div>
  </div>

  <!-- ================= 2. RESUME FORMAT SELECTOR ================= -->
  <div class="card antigravity-element">
    <h3>2. Pick Resume Format</h3>
    <select id="resumeFormat" onchange="loadTemplate()">
      <optgroup label="Open Source Templates">
        <option value="jsonresume">JSON Resume (opensource.org standard, ATS-friendly)</option>
        <option value="awesomecv">Awesome-CV (LaTeX, GitHub open-source)</option>
        <option value="reactive-resume">Reactive Resume (opensource, most customizable)</option>
      </optgroup>
      <optgroup label="Top Company Formats">
        <option value="google">Google / Alphabet style</option>
        <option value="amazon">Amazon (STAR/Leadership Principles style)</option>
        <option value="microsoft">Microsoft style</option>
        <option value="meta">Meta style</option>
      </optgroup>
      <optgroup label="India Service-based">
        <option value="tcs">TCS / Infosys / Wipro style</option>
      </optgroup>
      <optgroup label="Other">
        <option value="startup">Startup (concise, project-heavy)</option>
        <option value="core">Core/Technical (mech, civil, electrical)</option>
        <option value="psu">Government/PSU (formal, detailed)</option>
      </optgroup>
    </select>
    <div id="templatePreview" class="preview-box"></div>
    <button onclick="buildResume()">🛠 Build Resume (using Connected Data + this format)</button>
    <button onclick="downloadTemplate()">⬇ Download blank template (.docx)</button>
  </div>

  <!-- ================= 3. ATS SCORE CHECKER ================= -->
  <div class="card antigravity-element">
    <h3>3. ATS Score Checker</h3>
    <label>Upload your resume (PDF/DOCX):</label>
    <input type="file" id="resumeFile" accept=".pdf,.docx">
    <textarea id="jobDesc" placeholder="Paste the Job Description here..." rows="6"></textarea>
    <button onclick="checkATS()">🔍 Check Score + Get Fix Suggestions</button>

    <div id="atsResult" class="result-box" style="display:none;">
      <h4>Match Score: <span id="atsScore">0</span>%</h4>
      <div class="score-bar"><div id="scoreFill" class="score-fill"></div></div>
      <p><strong>Missing keywords to add:</strong></p>
      <div id="missingKeywords" class="keyword-tags"></div>
      <p><strong>How to improve:</strong></p>
      <ul id="improveTips"></ul>
    </div>
  </div>

  <!-- ================= ANTIGRAVITY CONTROLLER ================= -->
  <div class="antigravity-controls">
    <button type="button" class="btn-antigravity" onclick="toggleAntigravity()">
      🚀 Toggle Antigravity Mode
    </button>
  </div>
</section>

<style>
  /* Base Card Styling with Smooth Transitions */
  #resumeTab .card { 
    background:#fff; 
    border-radius:10px; 
    padding:20px; 
    margin-bottom:20px; 
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
    transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
  }

  /* Gravity-Defying Hover State */
  #resumeTab .card:hover {
    transform: translateY(-8px) scale(1.01);
    box-shadow: 0 15px 30px rgba(79, 70, 229, 0.15);
  }

  #resumeTab textarea, #resumeTab select, #resumeTab input { 
    width:100%; 
    margin:8px 0; 
    padding:10px; 
    border:1px solid #ddd; 
    border-radius:6px; 
    font-family:inherit; 
    transition: transform 0.2s ease, border-color 0.2s ease;
  }

  #resumeTab textarea:focus, #resumeTab select:focus, #resumeTab input:focus {
    transform: translateY(-2px);
    border-color: #4f46e5;
    outline: none;
  }

  #resumeTab button { 
    background:#4f46e5; 
    color:#fff; 
    border:none; 
    padding:10px 16px; 
    border-radius:6px; 
    cursor:pointer; 
    margin-top:6px; 
    margin-right:8px; 
    font-weight: 500;
    transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }

  #resumeTab button:hover { 
    background:#4338ca; 
    transform: translateY(-3px);
    box-shadow: 0 4px 12px rgba(67, 56, 202, 0.3);
  }

  #resumeTab .hint { font-size:13px; color:#6b7280; margin-top:-4px; margin-bottom: 12px; }
  
  /* Social Integration Buttons */
  .social-login-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .btn-social { display: inline-flex; align-items: center; justify-content: center; background: #f3f4f6 !important; color: #374151 !important; border: 1px solid #d1d5db !important; }
  .btn-social:hover { background: #e5e7eb !important; }
  .btn-social .icon { width: 18px; height: 18px; margin-right: 8px; }
  .btn-linkedin { border-color: #0077b5 !important; color: #0077b5 !important; background: #f0f7fa !important; }
  .btn-google { border-color: #4285F4 !important; color: #1f2937 !important; }
  .btn-microsoft { border-color: #00a4ef !important; color: #1f2937 !important; }
  .status-msg { font-size: 13px; font-weight: 500; margin-top: 6px; }

  .preview-box { min-height:60px; background:#f9fafb; border:1px dashed #ccc; border-radius:6px; padding:12px; margin-top:10px; font-size:14px; color:#555; }
  .score-bar { background:#e5e7eb; border-radius:10px; height:14px; overflow:hidden; margin:8px 0; }
  .score-fill { height:100%; background:linear-gradient(90deg,#f87171,#facc15,#4ade80); width:0%; transition:width .5s; }
  .keyword-tags span { display:inline-block; background:#fee2e2; color:#b91c1c; padding:4px 10px; border-radius:20px; margin:4px; font-size:13px; }
  #improveTips li { margin:4px 0; font-size:14px; }

  /* Antigravity Floating Mode Toggle */
  .btn-antigravity {
    background: linear-gradient(135deg, #ec4899, #8b5cf6) !important;
    font-weight: 600 !important;
    box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
  }

  /* Full Zero-Gravity State */
  .zero-gravity .antigravity-element {
    animation: floatAnimation 4s ease-in-out infinite alternate;
  }
  .zero-gravity .antigravity-element:nth-child(1) { animation-delay: 0s; }
  .zero-gravity .antigravity-element:nth-child(2) { animation-delay: 0.8s; }
  .zero-gravity .antigravity-element:nth-child(3) { animation-delay: 1.6s; }

  @keyframes floatAnimation {
    0% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-18px) rotate(-1deg); }
    100% { transform: translateY(-30px) rotate(1deg); }
  }
</style>

<script>
// ---------- ANTIGRAVITY MODE TOGGLE ----------
let isAntigravityActive = false;

function toggleAntigravity() {
  const tab = document.getElementById('resumeTab');
  isAntigravityActive = !isAntigravityActive;
  
  if (isAntigravityActive) {
    tab.classList.add('zero-gravity');
    console.log("🌌 Antigravity engaged!");
  } else {
    tab.classList.remove('zero-gravity');
    console.log("🌍 Gravity restored.");
  }
}

// State variable to store imported profile data locally
let importedUserData = null;

// ---------- OAuth Integrations ----------
function connectLinkedIn() {
  const status = document.getElementById('importStatus');
  status.style.color = '#0077b5';
  status.innerText = "Connecting to LinkedIn OAuth...";

  const clientId = 'YOUR_LINKEDIN_CLIENT_ID';
  const redirectUri = encodeURIComponent(window.location.origin + '/api/auth/linkedin/callback');
  window.open(`/api/auth/linkedin?redirect=${redirectUri}`, 'LinkedIn Auth', 'width=600,height=600');

  setTimeout(() => {
    importedUserData = { source: 'LinkedIn', profile: { name: "John Doe", title: "Software Engineer" } };
    status.innerText = "✓ Successfully imported profile details from LinkedIn!";
  }, 1200);
}

function connectGoogle() {
  const status = document.getElementById('importStatus');
  status.style.color = '#4285F4';
  status.innerText = "Connecting to Google Workspace / Drive...";

  window.open('/api/auth/google', 'Google Auth', 'width=600,height=600');

  setTimeout(() => {
    importedUserData = { source: 'Google', profile: { name: "John Doe", email: "john@gmail.com" } };
    status.innerText = "✓ Successfully imported profile & Google Docs history!";
  }, 1200);
}

function connectMicrosoft() {
  const status = document.getElementById('importStatus');
  status.style.color = '#05a6f0';
  status.innerText = "Connecting to Microsoft Edge / Graph API...";

  window.open('/api/auth/microsoft', 'Microsoft Auth', 'width=600,height=600');

  setTimeout(() => {
    importedUserData = { source: 'Microsoft', profile: { name: "John Doe", account: "Outlook/Office365" } };
    status.innerText = "✓ Successfully connected to Microsoft Graph API!";
  }, 1200);
}

// ---------- TEMPLATE PREVIEW ----------
const TEMPLATES = {
  jsonresume:     "JSON Resume schema (resume.json) → rendered via open-source theme. Fully structured, plain-text parsable = best for ATS.",
  awesomecv:      "LaTeX-based, clean single-column, GitHub open-source (posquit0/Awesome-CV). Great for tech roles, but export to PDF text-based (not image) for ATS.",
  "reactive-resume": "Reactive Resume (open-source, github.com/AmruthPillai/Reactive-Resume). Drag-drop sections, exports ATS-safe PDF.",
  google:   "Sections: Summary → Skills → Projects (impact metrics, numbers) → Experience → Education. 1 page, action verbs.",
  amazon:   "Sections: Summary → Experience (STAR format: Situation-Task-Action-Result, tie to Leadership Principles) → Projects → Skills → Education.",
  microsoft:"Sections: Summary → Technical Skills → Experience/Projects → Education → Certifications.",
  meta:     "Sections: Summary → Impact-driven bullet points → Projects → Skills → Education. Emphasize scale/metrics.",
  tcs:      "Sections: Career Objective → Technical Skills → Academic Projects → Internships → Education → Certifications → Personal Details.",
  startup:  "Sections: Summary → Key Projects (with links) → Skills → Experience → Education. Bullet-heavy, no fluff.",
  core:     "Sections: Objective → Technical Skills → Major/Minor Projects → Internships/Training → Workshops → Education → Personal Info.",
  psu:      "Sections: Personal Details → Educational Qualification (tabular) → Technical Skills → Projects → Training/Internship → Declaration."
};

function loadTemplate() {
  const fmt = document.getElementById('resumeFormat').value;
  document.getElementById('templatePreview').innerText = TEMPLATES[fmt];
}
loadTemplate();

function buildResume() {
  const fmt = document.getElementById('resumeFormat').value;

  fetch('/api/resume/build', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ 
      format: fmt, 
      importedData: importedUserData 
    })
  })
  .then(r => r.blob())
  .then(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `resume_${fmt}.docx`; a.click();
  })
  .catch(() => alert("Backend route /api/resume/build not connected yet"));
}

function downloadTemplate() {
  const fmt = document.getElementById('resumeFormat').value;
  window.location.href = `/api/resume/template/${fmt}`;
}

// ---------- ATS CHECKER — FILE UPLOAD ----------
function checkATS() {
  const file = document.getElementById('resumeFile').files[0];
  const jd = document.getElementById('jobDesc').value;
  if (!file) { alert("Upload your resume file (PDF/DOCX)"); return; }
  if (!jd.trim()) { alert("Paste the Job Description"); return; }

  const formData = new FormData();
  formData.append('resume', file);
  formData.append('job_description', jd);

  fetch('/api/resume/ats-check', { method: 'POST', body: formData })
    .then(r => r.json())
    .then(data => renderATSResult(data.score, data.missing_keywords, data.tips))
    .catch(() => {
      renderATSResult(62, ["docker", "kubernetes", "ci/cd"],
        ["Add a Skills section listing tools from the JD explicitly",
         "Quantify project outcomes with numbers (%, users, time saved)",
         "Use standard section headers (Experience, Education) — avoid tables/columns, ATS parsers skip them"]);
    });
}

function renderATSResult(score, missing, tips) {
  document.getElementById('atsResult').style.display = 'block';
  document.getElementById('atsScore').innerText = score;
  document.getElementById('scoreFill').style.width = score + '%';
  document.getElementById('missingKeywords').innerHTML =
    missing.length ? missing.map(k => `<span>${k}</span>`).join('') : "None 🎉";
  document.getElementById('improveTips').innerHTML =
    tips.map(t => `<li>${t}</li>`).join('');
}
</script>
